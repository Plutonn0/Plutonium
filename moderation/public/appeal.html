<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plutonium · Appeal</title>
<style>body{color:#eee;background:#0c0c0e;font:16px system-ui;max-width:540px;margin:10vh auto;padding:24px}label{display:block;margin:22px 0 8px}input,textarea,button{box-sizing:border-box;width:100%;padding:14px;background:#19191d;color:#eee;border:1px solid #444;border-radius:8px;font:inherit}button{margin-top:22px;background:#e9e9e9;color:#111;font-weight:600;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.6;color:#aaa}</style>
<h1>Appeal your restriction</h1><p>Tell us what happened. Submitting an appeal does not automatically restore access.</p>
<form id="appeal"><label for="username">Username</label><input id="username" name="username" required minlength="3" maxlength="16" pattern="[A-Za-z0-9_]{3,16}" autocomplete="username"><label for="explanation">What happened?</label><textarea id="explanation" name="explanation" required minlength="10" maxlength="2000" rows="7"></textarea><div class="cf-turnstile" data-sitekey="0x4AAAAAAFRnWKio_siOWXC_" data-action="appeal" data-theme="dark"></div><button id="submit">Send appeal</button><p id="result" role="status" aria-live="polite"></p></form>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
const api='https://plutonium-moderation.vercel.app/api/v1';
document.getElementById('appeal').addEventListener('submit',async event=>{
 event.preventDefault();const form=event.currentTarget,button=document.getElementById('submit'),result=document.getElementById('result');
 const values=new FormData(form);button.disabled=true;result.textContent='Sending…';
 try{const response=await fetch(api+'/appeals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:values.get('username'),explanation:values.get('explanation'),captcha:values.get('cf-turnstile-response')})});
 const body=await response.json();if(!response.ok)throw new Error(body.error||'Could not send the appeal.');result.textContent=body.message;form.reset();}
 catch(error){result.textContent=error.message||'Network error. Your explanation has been kept; please retry.';}
 finally{button.disabled=false;if(window.turnstile)window.turnstile.reset();}
});
</script></html>
